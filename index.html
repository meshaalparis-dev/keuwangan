<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FINORA — Manajemen Keuangan Pribadi</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="%23b8f04a"/><path d="M10 24V8h12v3.5h-8v3h7V18h-7v6z" fill="%2307120a"/></svg>'>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ 1. BASE & VARIABEL ============ */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#070b09; --bg2:#0a100d;
  --sf:#0e1511; --sf2:#121b15; --sf3:#17231b;
  --line:rgba(163,230,53,.08); --line2:rgba(163,230,53,.18);
  --text:#e9f1ea; --muted:#93a598; --faint:#5e7064;
  --lime:#b8f04a; --lime2:#8fd42f; --lime-soft:rgba(184,240,74,.11);
  --green:#2fbf71; --green-deep:#0f3d26;
  --rose:#fb7185; --rose-soft:rgba(251,113,133,.12);
  --amber:#fbbf24; --amber-soft:rgba(251,191,36,.12);
  --cyan:#67e8f9; --cyan-soft:rgba(103,232,249,.1);
  --fd:'Space Grotesk',sans-serif; --fb:'Inter',sans-serif;
  --r:14px; --r-s:10px;
  --shadow:0 18px 44px -18px rgba(0,0,0,.6);
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--fb);font-size:14px;line-height:1.5;min-height:100vh}
body.lock-scroll{overflow:hidden}
::selection{background:rgba(184,240,74,.28)}
h1,h2,h3,h4{font-family:var(--fd);font-weight:600;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text)}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
.muted{color:var(--muted)} .faint{color:var(--faint)} .sm{font-size:12.5px} .xs{font-size:11.5px}
.num{font-family:var(--fd);font-variant-numeric:tabular-nums}

/* latar ambient hidup */
.bg-fx{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;
  background:
    radial-gradient(900px 500px at -10% -10%, rgba(31,122,69,.16), transparent 60%),
    radial-gradient(700px 420px at 105% 0%, rgba(184,240,74,.06), transparent 55%),
    radial-gradient(800px 600px at 50% 115%, rgba(15,61,38,.25), transparent 60%);}
.bg-fx::after{content:"";position:absolute;inset:0;opacity:.05;
  background-image:linear-gradient(rgba(184,240,74,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(184,240,74,.5) 1px,transparent 1px);
  background-size:44px 44px;mask-image:radial-gradient(ellipse at 30% 0%,#000 0%,transparent 70%)}
.orb{position:absolute;border-radius:50%;filter:blur(95px)}
.orb1{width:430px;height:430px;background:rgba(20,83,45,.55);top:-140px;left:-100px;animation:drift1 19s ease-in-out infinite alternate}
.orb2{width:380px;height:380px;background:rgba(184,240,74,.14);bottom:-160px;right:-110px;animation:drift2 23s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(70px,50px) scale(1.08)}}
@keyframes drift2{to{transform:translate(-60px,-70px) scale(1.1)}}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#1c2a21;border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

/* ============ 2. LAYOUT ============ */
#sidebar{position:fixed;inset:0 auto 0 0;width:244px;z-index:60;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#0b120e,#080d0a);border-right:1px solid var(--line);padding:18px 14px;transition:transform .28s cubic-bezier(.2,.7,.3,1)}
#main{margin-left:244px;min-height:100vh;display:flex;flex-direction:column;position:relative;z-index:1}
#scrim{position:fixed;inset:0;background:rgba(3,7,5,.6);backdrop-filter:blur(3px);z-index:55;opacity:0;pointer-events:none;transition:.25s}
#scrim.on{opacity:1;pointer-events:auto}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 18px;border-bottom:1px solid var(--line);margin-bottom:12px}
.logo-mark{position:relative;width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--lime),#7cc62e);display:grid;place-items:center;
  font-family:var(--fd);font-weight:700;font-size:20px;color:#07120a;box-shadow:0 0 24px rgba(184,240,74,.35),inset 0 -3px 6px rgba(0,0,0,.2)}
.logo-mark::after{content:"";position:absolute;inset:-4px;border-radius:14px;border:1.5px solid rgba(184,240,74,.25);animation:pulse 3s infinite}
.brand h2{font-size:17px;letter-spacing:.04em}
.brand span{display:block;font-size:9.5px;color:var(--lime);letter-spacing:.24em;font-weight:700;font-family:var(--fb)}
.snav{flex:1;overflow-y:auto;padding-right:2px}
.nsec{font-size:10px;letter-spacing:.2em;color:var(--faint);text-transform:uppercase;padding:14px 10px 6px;font-weight:600}
.snav a{display:flex;align-items:center;gap:11px;padding:9.5px 11px;border-radius:10px;color:var(--muted);font-weight:500;font-size:13.5px;position:relative;transition:.18s;margin-bottom:2px}
.snav a svg{flex:none;opacity:.85}
.snav a:hover{color:var(--text);background:rgba(184,240,74,.05)}
.snav a.on{color:var(--lime);background:var(--lime-soft)}
.snav a.on::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--lime);box-shadow:0 0 10px var(--lime)}
.nkbd{margin-left:auto;font-size:9.5px;color:var(--faint);border:1px solid var(--line);border-radius:5px;padding:0 5px;font-family:var(--fd)}
.nbadge{margin-left:auto;background:var(--rose-soft);color:var(--rose);font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px}
.sb-card{background:linear-gradient(135deg,rgba(184,240,74,.1),rgba(47,191,113,.06));border:1px solid var(--line2);border-radius:12px;padding:12px 14px;margin-top:10px}
.sb-card .lbl{font-size:10.5px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;font-weight:600;margin:0}
.sb-card .val{font-family:var(--fd);font-size:19px;font-weight:700;color:var(--lime);margin-top:2px}
.sb-user{display:flex;align-items:center;gap:10px;padding:12px 8px 2px;margin-top:10px;border-top:1px solid var(--line)}
.avatar{width:34px;height:34px;border-radius:10px;background:var(--green-deep);border:1px solid var(--line2);display:grid;place-items:center;font-weight:700;color:var(--lime);font-family:var(--fd)}
.sb-user b{font-size:13px;display:block;line-height:1.2}
.sb-user span{font-size:11px;color:var(--faint)}

/* ============ 3. TOPBAR ============ */
#topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:14px 28px;
  background:rgba(7,11,9,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.tb-title h1{font-size:19px}
.tb-title p{font-size:12px;color:var(--faint)}
.tb-search{margin-left:auto;position:relative;flex:0 1 360px;min-width:150px}
.tb-search>svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.tb-search input{width:100%;background:#0a100d;border:1px solid var(--line);border-radius:11px;padding:9px 12px 9px 38px;outline:none;transition:.2s}
.tb-search input:focus{border-color:var(--line2);box-shadow:0 0 0 3px rgba(184,240,74,.08)}
.gsres{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--sf2);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;display:none;max-height:380px;overflow-y:auto}
.gsres.on{display:block;animation:fadeUp .2s both}
.gs-g{padding:8px 14px 4px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:700}
.gs-i{display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;transition:.15s}
.gs-i:hover{background:rgba(184,240,74,.06)}
.gs-i b{font-size:13px}
.gs-i span{margin-left:auto;font-family:var(--fd);font-size:12.5px;color:var(--muted)}
.bell{position:relative}
.dot{position:absolute;top:6px;right:7px;min-width:15px;height:15px;border-radius:99px;background:var(--rose);color:#fff;font-size:9.5px;font-weight:700;display:none;place-items:center;padding:0 3px;border:2px solid var(--bg)}
.dot.on{display:grid}
.notifp{position:absolute;top:calc(100% + 10px);right:28px;width:360px;max-width:calc(100vw - 32px);background:var(--sf2);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow);z-index:80;display:none;overflow:hidden}
.notifp.on{display:block;animation:fadeUp .22s both}
.np-h{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line)}
.np-h b{font-family:var(--fd)}
.np-i{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:.15s}
.np-i:hover{background:rgba(184,240,74,.05)}
.np-i .ic{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
.np-i b{font-size:13px;display:block}
.np-i p{font-size:12px;color:var(--muted)}
.only-m{display:none}

/* ============ 4. KOMPONEN ============ */
#view{padding:26px 28px 60px;max-width:1400px;width:100%;margin:0 auto}
.view-enter>*{opacity:0;animation:fadeUp .5s cubic-bezier(.2,.7,.3,1) forwards}
.view-enter>*:nth-child(1){animation-delay:.02s}.view-enter>*:nth-child(2){animation-delay:.07s}
.view-enter>*:nth-child(3){animation-delay:.12s}.view-enter>*:nth-child(4){animation-delay:.17s}
.view-enter>*:nth-child(5){animation-delay:.22s}.view-enter>*:nth-child(6){animation-delay:.27s}
.view-enter>*:nth-child(7){animation-delay:.32s}.view-enter>*:nth-child(8){animation-delay:.37s}
.card{background:linear-gradient(180deg,#101713,#0c120f);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 1px 0 rgba(255,255,255,.03) inset}
.card.pad{padding:18px 20px}
.card.lift{transition:.22s}
.card.lift:hover{transform:translateY(-2px);border-color:var(--line2);box-shadow:var(--shadow)}
.chead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.chead h3{font-size:15px}
.chead p{font-size:12px;color:var(--faint)}
.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g-main{grid-template-columns:1.85fr 1fr}
.g-inv{grid-template-columns:1fr 1.85fr}
.stack{display:flex;flex-direction:column;gap:18px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.greet-t{font-size:25px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:11px;font-weight:600;font-size:13.5px;transition:.18s;border:1px solid transparent;white-space:nowrap}
.btn.primary{background:linear-gradient(135deg,var(--lime),#9ade3a);color:#07120a;box-shadow:0 4px 18px -4px rgba(184,240,74,.4);position:relative;overflow:hidden}
.btn.primary::before{content:"";position:absolute;top:0;left:-80%;width:55%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-20deg);transition:.55s}
.btn.primary:hover{transform:translateY(-1px);box-shadow:0 8px 26px -6px rgba(184,240,74,.55)}
.btn.primary:hover::before{left:135%}
.btn.ghost{border-color:var(--line2);color:var(--text);background:rgba(255,255,255,.02)}
.btn.ghost:hover{border-color:var(--lime);color:var(--lime)}
.btn.danger{background:var(--rose-soft);color:var(--rose);border-color:rgba(251,113,133,.3)}
.btn.danger:hover{background:rgba(251,113,133,.22)}
.btn.sm{padding:6px 12px;font-size:12.5px;border-radius:9px}
.icon-btn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;border:1px solid var(--line);background:var(--sf);color:var(--muted);transition:.18s;flex:none}
.icon-btn:hover{color:var(--lime);border-color:var(--line2);transform:translateY(-1px)}
.icon-btn.tiny{width:30px;height:30px;border-radius:8px}
.inp,select.inp{width:100%;background:#0a100d;border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;transition:.18s}
.inp:focus{border-color:var(--lime);box-shadow:0 0 0 3px rgba(184,240,74,.1)}
select.inp{appearance:none;background-image:url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="12" height="8" fill="none"><path d="M1 1.5 6 6.5 11 1.5" stroke="%2393a598" stroke-width="1.8" stroke-linecap="round"/></svg>');background-repeat:no-repeat;background-position:right 12px center;padding-right:32px}
.lbl{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:13px 0 6px}
.lbl:first-child{margin-top:0}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:600}
.chip.ok{background:var(--lime-soft);color:var(--lime)}
.chip.warn{background:var(--amber-soft);color:var(--amber)}
.chip.err{background:var(--rose-soft);color:var(--rose)}
.chip.mut{background:rgba(147,165,152,.1);color:var(--muted)}
.chip.cy{background:var(--cyan-soft);color:var(--cyan)}
.pbar{height:8px;background:#14201a;border-radius:99px;overflow:hidden;position:relative}
.pbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--lime2),var(--lime));animation:growW .9s cubic-bezier(.2,.7,.3,1) both}
.pbar i.warn{background:linear-gradient(90deg,#d99a16,var(--amber))}
.pbar i.err{background:linear-gradient(90deg,#e04a63,var(--rose))}
.seg{display:inline-flex;background:#0a100d;border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
.seg button{padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted);transition:.16s}
.seg button.on{background:var(--lime);color:#07120a}
.seg button:not(.on):hover{color:var(--text)}

/* baris transaksi */
.trow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 8px;border-radius:11px;transition:.15s;position:relative}
.trow:hover{background:rgba(184,240,74,.04)}
.trow+.trow{border-top:1px solid var(--line)}
.ticon{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none}
.tmain{min-width:0}
.ttitle{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tsub{font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tamt{font-family:var(--fd);font-weight:600;font-size:13.5px;text-align:right;white-space:nowrap}
.tamt.in{color:var(--lime)} .tamt.out{color:var(--rose)} .tamt.mut{color:var(--cyan)}
.tact{display:flex;gap:4px;opacity:0;transition:.15s}
.trow:hover .tact{opacity:1}
.pill-in{font-family:var(--fd);font-size:12.5px;color:var(--muted);text-align:right}
.ins-row{display:flex;gap:12px;align-items:flex-start;padding:10px 2px;border-bottom:1px solid var(--line)}
.ins-row:last-child{border-bottom:none}
.ins-row b{display:block;font-size:13px}

/* stat card */
.stat{padding:18px 20px;position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;top:-40px;right:-40px;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,var(--tone,rgba(184,240,74,.1)),transparent 70%);pointer-events:none}
.s-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.s-lab{font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:600}
.s-icn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--tone,var(--lime-soft));color:var(--tone-c,var(--lime))}
.s-num{font-family:var(--fd);font-size:26px;font-weight:700;letter-spacing:-.02em}
.s-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;min-height:22px}
.delta{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px}
.delta.up{background:var(--lime-soft);color:var(--lime)}
.delta.dn{background:var(--rose-soft);color:var(--rose)}

/* chart */
.chart{width:100%;height:auto;display:block}
.cgrid{stroke:rgba(163,230,53,.07)}
.cylab,.cxl{fill:var(--faint);font-size:10.5px;font-family:var(--fb)}
.cbar{transform-box:fill-box;transform-origin:bottom;animation:growY .7s cubic-bezier(.2,.7,.3,1) both;cursor:pointer;transition:filter .15s}
.cbar:hover{filter:brightness(1.25)}
.dseg{cursor:pointer;transition:.15s;animation:dsegIn .9s cubic-bezier(.2,.7,.3,1) both}
.dseg:hover{stroke-width:24px;filter:brightness(1.15)}
.dc1{fill:var(--text);font-family:var(--fd);font-size:17px;font-weight:700}
.dc2{fill:var(--faint);font-size:10px;letter-spacing:.15em;text-transform:uppercase}
.donutwrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.donut{width:180px;flex:none}
.dleg{flex:1;min-width:170px;display:flex;flex-direction:column;gap:8px}
.dleg-r{display:flex;align-items:center;gap:9px;font-size:12.5px}
.dsw{width:10px;height:10px;border-radius:3.5px;flex:none}
.dleg-l{flex:1;color:var(--muted)} .dleg-v{font-family:var(--fd);font-weight:600} .dleg-p{width:38px;text-align:right}
.lpt{cursor:pointer;transition:r .15s}
.lpt:hover{r:5.5}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}

/* ring skor */
.ring{width:148px;flex:none}
.ringv{animation:ringA 1.2s cubic-bezier(.2,.7,.3,1) both}
@keyframes ringA{from{stroke-dashoffset:var(--c)}}
.rv1{fill:var(--text);font-family:var(--fd);font-size:31px;font-weight:700}
.rv2{fill:var(--faint);font-size:10px;letter-spacing:.2em}

/* heatmap */
.hm-wrap{overflow-x:auto;padding-bottom:4px}
.hm{display:flex;gap:3px;width:max-content}
.hm-col{display:flex;flex-direction:column;gap:3px}
.hm-c{width:11px;height:11px;border-radius:3px;background:#0f1712;transition:.15s;cursor:default}
.hm-c:hover{transform:scale(1.3)}
.hm-c.l1{background:rgba(184,240,74,.2)}
.hm-c.l2{background:rgba(184,240,74,.4)}
.hm-c.l3{background:rgba(184,240,74,.65)}
.hm-c.l4{background:#b8f04a;box-shadow:0 0 7px rgba(184,240,74,.55)}
.hm-c.lf{opacity:.22}

/* kalender */
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.calhd{font-size:11px;color:var(--faint);text-align:center;font-weight:600;padding:4px 0;letter-spacing:.08em}
.calcell{min-height:86px;background:#0b110e;border:1px solid var(--line);border-radius:10px;padding:7px 8px;cursor:pointer;transition:.16s;position:relative}
.calcell:hover{border-color:var(--line2);transform:translateY(-1px)}
.calcell.dim{opacity:.32}
.calcell.today{border-color:var(--lime)}
.calcell.sel{border-color:var(--lime);background:var(--lime-soft)}
.calcell .dn{font-family:var(--fd);font-weight:600;font-size:12.5px}
.caldots{display:flex;gap:3px;flex-wrap:wrap;margin-top:6px}
.caldots i{width:6px;height:6px;border-radius:99px}
.calamt{font-size:10px;margin-top:5px;font-family:var(--fd);font-weight:600}
#chart-tip{position:fixed;z-index:250;background:#182219;border:1px solid var(--line2);color:var(--text);font-size:12px;font-weight:600;padding:7px 11px;border-radius:9px;pointer-events:none;opacity:0;transition:opacity .12s;box-shadow:var(--shadow);white-space:nowrap;font-family:var(--fd)}
#chart-tip.on{opacity:1}

/* empty state */
.empty{padding:52px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty .eic{width:76px;height:76px;border-radius:24px;border:1.5px dashed var(--line2);display:grid;place-items:center;color:var(--lime);background:rgba(184,240,74,.04);margin-bottom:4px}
.empty h3{font-size:17px}
.empty p{color:var(--muted);max-width:380px;font-size:13px}

db.dismissedNotifs=db.dismissedNotifs||[];db.flags=db.flags||{welcomed:true};db.security=db.security||{pin:null};
db.emergency=db.emergency||{target:20000000,history:[]};db.ui=db.ui||{privacy:false};db.version='4.8';
function runRecurring(){
  const today=todayISO();let changed=false;
  for(const t of [...db.transactions]){
    if(!t.recur||t.recur.freq==='none'||!t.recur.next)continue;
    let guard=0;
    while(t.recur.next<=today&&(!t.recur.until||t.recur.next<=t.recur.until)&&guard++<400){
      db.transactions.push({id:uid(),type:t.type,amount:t.amount,walletId:t.walletId,toWalletId:t.toWalletId,categoryId:t.categoryId,date:t.recur.next,method:t.method,note:t.note,createdAt:Date.now(),parentId:t.id});
      t.recur.next=advanceDate(t.recur.next,t.recur.freq);changed=true;
    }
    if(t.recur.until&&t.recur.next>t.recur.until)t.recur={freq:'none'};
  }
  return changed;
}
function save(){runRecurring();try{localStorage.setItem(LS_KEY,JSON.stringify(db));}catch(e){toast('Gagal menyimpan data','err');}updateChrome();}

/* ---------- 4. MESIN KEUANGAN ---------- */
function txEffect(t,wid){
  switch(t.type){
    case 'income':return t.walletId===wid?t.amount:0;
    case 'expense':return t.walletId===wid?-t.amount:0;
    case 'transfer':return (t.walletId===wid?-t.amount:0)+(t.toWalletId===wid?t.amount:0);
    case 'saving_add':case 'emergency_add':case 'debt_pay':case 'lend_out':return t.walletId===wid?-t.amount:0;
    case 'saving_withdraw':case 'emergency_use':case 'debt_receive':case 'lend_collect':return t.walletId===wid?t.amount:0;
  }return 0;
}
const getTx=id=>db.transactions.find(t=>t.id===id);
const catById=id=>db.categories.find(c=>c.id===id);
const walletById=id=>db.wallets.find(w=>w.id===id);
const wName=id=>walletById(id)?.name||'—';
const wIcon=id=>WTYPES[walletById(id)?.type||'cash']?.i||'wallet';
function walletBalance(w){let b=w.initial||0;for(const t of db.transactions)b+=txEffect(t,w.id);return b;}
const totalBalance=()=>db.wallets.reduce((s,w)=>s+walletBalance(w),0);
const sumType=(mk,type)=>db.transactions.reduce((s,t)=>t.type===type&&t.date.startsWith(mk)?s+t.amount:s,0);
const catSpend=(mk,catId)=>db.transactions.reduce((s,t)=>t.type==='expense'&&t.categoryId===catId&&t.date.startsWith(mk)?s+t.amount:s,0);
function rangeTx(s,e){return db.transactions.filter(t=>t.date>=s&&t.date<=e);}
function walletLedger(w){
  const txs=db.transactions.filter(t=>txEffect(t,w.id)!==0).sort((a,b)=>a.date.localeCompare(b.date)||a.createdAt-b.createdAt);
  let bal=w.initial||0;const rows=txs.map(t=>{bal+=txEffect(t,w.id);return{t,bal};});return rows.reverse();
}
const goalCurrent=g=>g.history.reduce((s,h)=>s+(h.type==='add'?h.amount:-h.amount),0);
const efBalance=()=>db.emergency.history.reduce((s,h)=>s+(h.type==='add'?h.amount:-h.amount),0);
const savedTotal=()=>db.goals.reduce((s,g)=>s+goalCurrent(g),0)+efBalance();
const debtPaid=d=>d.payments.reduce((s,p)=>s+p.amount,0);
const debtLeft=d=>Math.max(0,d.amount-debtPaid(d));
const debtsOpen=k=>db.debts.filter(d=>d.kind===k&&debtLeft(d)>0);
function balanceAt(ds){let b=db.wallets.reduce((s,w)=>s+(w.initial||0),0);for(const t of db.transactions){if(t.date<=ds)b+=t.type==='income'?t.amount:t.type==='expense'?-t.amount:0;}return b;}
function balanceLastDays(n){const o=[];for(let i=n-1;i>=0;i--)o.push(balanceAt(iso(addDays(new Date(),-i))));return o;}
function projBalance(wid,tx,excludeId){
  let b=walletBalance(walletById(wid));
  if(excludeId){const old=getTx(excludeId);if(old)b-=txEffect(old,wid);}
  return b+txEffect(tx,wid);
}
function goalETA(g){
  const need=g.target-goalCurrent(g);
  if(need<=0)return 'Target tercapai 🎉';
  const byM={};g.history.filter(h=>h.type==='add').forEach(h=>{const k=h.date.slice(0,7);byM[k]=(byM[k]||0)+h.amount;});
  const vals=Object.values(byM);if(!vals.length)return 'Belum ada pola';
  const avg=vals.reduce((a,b)=>a+b,0)/vals.length;
  if(avg<=0)return 'Belum ada pola';
  const m=need/avg;
  if(m<1)return `± ${Math.ceil(need/avg*30)} hari lagi`;
  return `± ${Math.floor(m)} bln ${Math.round((m%1)*30)} hr lagi`;
}

/* ---------- 4b. SKOR KESEHATAN & INSIGHT (BARU 4.8) ---------- */
function healthScore(){
  const parts=[];let inc=0,exp=0;
  for(let i=0;i<3;i++){const k=mkOff(i);inc+=sumType(k,'income');exp+=sumType(k,'expense');}
  const sr=inc>0?(inc-exp)/inc:0;
  parts.push({label:'Rasio Menabung',score:clamp(sr/0.25,0,1)*100,weight:.3,desc:inc?Math.round(sr*100)+'% pendapatan tersisa (ideal ≥20%)':'Belum ada pendapatan tercatat'});
  const avgExp=exp/3,cov=avgExp>0?efBalance()/(avgExp*3):0;
  parts.push({label:'Dana Darurat',score:clamp(cov,0,1)*100,weight:.25,desc:avgExp?'Mencakup '+Math.round(cov*100)+'% dari 3× pengeluaran bulanan':'Belum ada pengeluaran sebagai acuan'});
  const mk=monthKey(todayISO());const budg=db.budgets.filter(b=>b.month===mk);let bd=60;
  if(budg.length){const ratios=budg.map(b=>b.limit?catSpend(mk,b.categoryId)/b.limit:0);const over=ratios.filter(r=>r>=1).length;const avg=ratios.reduce((a,b)=>a+b,0)/ratios.length;bd=clamp(clamp(1-avg,0,1)*100-over*15,0,100);}
  parts.push({label:'Disiplin Anggaran',score:bd,weight:.25,desc:budg.length?budg.length+' anggaran aktif bulan ini':'Belum ada anggaran — buat di menu Anggaran'});
  const debt=debtsOpen('hutang').reduce((s,d)=>s+debtLeft(d),0),mInc=inc/3;
  const dr=mInc>0?debt/mInc:(debt>0?1:0);
  parts.push({label:'Beban Utang',score:clamp(1-dr,0,1)*100,weight:.2,desc:debt?money(debt)+' utang berjalan':'Tidak ada utang berjalan 👍'});
  const hasData=inc>0||exp>0||db.transactions.length>0;
  return {total:Math.round(parts.reduce((s,p)=>s+p.score*p.weight,0)),parts,hasData};
}
function gradeOf(s){return s>=80?['Luar Biasa','ok']:s>=60?['Sehat','ok']:s>=40?['Cukup','warn']:['Perlu Perhatian','err'];}
function scoreRing(score){
  const r=52,C=2*Math.PI*r,col=score>=80?'#b8f04a':score>=60?'#2fbf71':score>=40?'#fbbf24':'#fb7185';
  const off=C*(1-score/100);
  return `<svg viewBox="0 0 130 130" class="ring"><circle cx="65" cy="65" r="${r}" fill="none" stroke="#152119" stroke-width="11"/><circle class="ringv" cx="65" cy="65" r="${r}" fill="none" stroke="${col}" stroke-width="11" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" style="--c:${C.toFixed(1)};stroke-dashoffset:${off.toFixed(1)}" transform="rotate(-90 65 65)"/><text x="65" y="63" text-anchor="middle" class="rv1">${score}</text><text x="65" y="80" text-anchor="middle" class="rv2">SKOR</text></svg>`;
}
function buildInsights(){
  const out=[];const mk=monthKey(todayISO()),pm=mkOff(1);
  const cur={},prev={};
  db.transactions.filter(t=>t.type==='expense').forEach(t=>{
    if(t.date.startsWith(mk))cur[t.categoryId]=(cur[t.categoryId]||0)+t.amount;
    else if(t.date.startsWith(pm))prev[t.categoryId]=(prev[t.categoryId]||0)+t.amount;
  });
  Object.entries(cur).map(([id,v])=>({c:catById(id),v,p:prev[id]||0,diff:v-(prev[id]||0)}))
    .filter(x=>x.p>0&&x.v>x.p*1.25&&x.diff>=50000).sort((a,b)=>b.diff-a.diff).slice(0,2)
    .forEach(r=>out.push({tone:'warn',icon:r.c?.icon||'trend',title:`${r.c?.name||'Kategori'} naik ${Math.round((r.v/r.p-1)*100)}%`,desc:`${money(r.p)} → ${money(r.v)} bulan ini`}));
  const top=Object.entries(cur).sort((a,b)=>b[1]-a[1])[0];
  if(top)out.push({tone:'info',icon:catById(top[0])?.icon||'tag',title:'Pengeluaran terbesar: '+(catById(top[0])?.name||'Lainnya'),desc:money(top[1])+' dikeluarkan bulan ini'});
  const inc=sumType(mk,'income'),exp=sumType(mk,'expense');
  if(inc>0){const sr=(inc-exp)/inc;
    if(sr<0)out.push({tone:'err',icon:'alert',title:'Pengeluaran melebihi pendapatan',desc:'Defisit '+money(exp-inc)+' bulan ini'});
    else if(sr>=0.2)out.push({tone:'ok',icon:'trend',title:'Rasio menabung sehat 👍',desc:Math.round(sr*100)+'% pendapatan tidak terpakai'});}
  const big=db.transactions.filter(t=>t.type==='expense'&&t.date.startsWith(mk)).sort((a,b)=>b.amount-a.amount)[0];
  if(big&&big.amount>=200000)out.push({tone:'mut',icon:'zap',title:'Transaksi terbesar bulan ini',desc:(catById(big.categoryId)?.name||TX_LABEL[big.type])+' • '+money(big.amount)});
  const upcoming=db.bills.filter(b=>!b.paid&&daysBetween(todayISO(),b.due)>=0&&daysBetween(todayISO(),b.due)<=7);
  if(upcoming.length)out.push({tone:'warn',icon:'receipt',title:upcoming.length+' tagihan jatuh tempo minggu ini',desc:'Total '+money(upcoming.reduce((s,b)=>s+b.amount,0))});
  const piut=debtsOpen('piutang').reduce((s,d)=>s+debtLeft(d),0);
  if(piut>0)out.push({tone:'info',icon:'debt',title:'Uang Anda masih di orang lain',desc:money(piut)+' piutang belum kembali'});
  return out.slice(0,5);
}
function heatMap(weeks=16){
  const byDay={};db.transactions.filter(t=>t.type==='expense').forEach(t=>{byDay[t.date]=(byDay[t.date]||0)+t.amount;});
  const t0=todayISO();
  const end=new Date();end.setDate(end.getDate()+(6-((end.getDay()+6)%7)));
  const start=addDays(end,-(weeks*7-1));
  let max=0;Object.values(byDay).forEach(v=>max=Math.max(max,v));
  let cols='';const d=new Date(start);
  for(let w=0;w<weeks;w++){let cells='';
    for(let i=0;i<7;i++){const ds=iso(d);const v=byDay[ds]||0,fut=ds>t0;
      const lvl=v<=0?0:v<=max*.25?1:v<=max*.5?2:v<=max*.75?3:4;
      cells+=`<i class="hm-c ${fut?'lf':'l'+lvl}" data-tip="${fmtDate(ds)}: ${money(v)}"></i>`;d.setDate(d.getDate()+1);}
    cols+=`<div class="hm-col">${cells}</div>`;}
  return `<div class="hm">${cols}</div>`;
}

/* ---------- 5. GRAFIK (SVG murni) ---------- */
function smoothPath(p){
  if(p.length<3)return 'M'+p.map(q=>q.x.toFixed(1)+','+q.y.toFixed(1)).join(' L');
  let d=`M${p[0].x.toFixed(1)},${p[0].y.toFixed(1)}`;
  for(let i=0;i<p.length-1;i++){const p0=p[Math.max(0,i-1)],p1=p[i],p2=p[i+1],p3=p[Math.min(p.length-1,i+2)];
    d+=`C${(p1.x+(p2.x-p0.x)/6).toFixed(1)},${(p1.y+(p2.y-p0.y)/6).toFixed(1)} ${(p2.x-(p3.x-p1.x)/6).toFixed(1)},${(p2.y-(p3.y-p1.y)/6).toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`;}
  return d;
}
function barChart(labels,series,h=240){
  const W=720,H=h,pL=46,pR=8,pT=14,pB=26;
  const max=Math.max(1,...series.flatMap(s=>s.values))*1.15;
  const gw=(W-pL-pR)/labels.length,bw=clamp((gw*.6)/series.length,6,26);
  let g='',bars='',xl='';
  for(let i=0;i<=4;i++){const y=pT+(H-pT-pB)*i/4;
    g+=`<line x1="${pL}" x2="${W-pR}" y1="${y}" y2="${y}" class="cgrid"/><text x="${pL-8}" y="${y+4}" class="cylab" text-anchor="end">${moneyShort(max*(1-i/4))}</text>`;}
  labels.forEach((lb,i)=>{
    const cx=pL+gw*i+gw/2;
    series.forEach((s,si)=>{
      const v=s.values[i]||0,bh=Math.max(1.5,(H-pT-pB)*v/max);
      const x=cx-(series.length*bw+(series.length-1)*4)/2+si*(bw+4);
      bars+=`<rect class="cbar" x="${x.toFixed(1)}" y="${(H-pB-bh).toFixed(1)}" width="${bw}" height="${bh.toFixed(1)}" rx="4" fill="${s.color}" data-tip="${esc(lb)} • ${s.name}: ${money(v)}" style="animation-delay:${(i*.04).toFixed(2)}s"/>`;
    });
    xl+=`<text x="${cx}" y="${H-8}" class="cxl" text-anchor="middle">${esc(lb)}</text>`;
  });
  const legend=`<div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${s.name}</span>`).join('')}</div>`;
  return `<div class="chead" style="margin-bottom:8px"><div style="flex:1"></div>${legend}</div><svg viewBox="0 0 ${W} ${H}" class="chart">${g}${bars}${xl}</svg>`;
}
function donut(items){
  const tot=items.reduce((s,i)=>s+i.value,0);if(tot<=0)return '';
  const r=62,C=2*Math.PI*r;let off=0,segs='';const gap=items.length>1?2.6:0;
  items.forEach(it=>{const fr=it.value/tot,len=Math.max(0,fr*C-gap);
    segs+=`<circle class="dseg" cx="90" cy="90" r="${r}" fill="none" stroke="${it.color}" stroke-width="20" stroke-dasharray="${len.toFixed(1)} ${(C-len).toFixed(1)}" stroke-dashoffset="${(-off-gap/2).toFixed(1)}" transform="rotate(-90 90 90)" style="--c:${C.toFixed(0)}" data-tip="${esc(it.label)}: ${money(it.value)} (${Math.round(fr*100)}%)"/>`;off+=fr*C;});
  return `<div class="donutwrap"><svg viewBox="0 0 180 180" class="donut">${segs}<text x="90" y="86" class="dc1" text-anchor="middle">${moneyShort(tot)}</text><text x="90" y="104" class="dc2" text-anchor="middle">Bulan ini</text></svg>
  <div class="dleg">${items.map(it=>`<div class="dleg-r"><span class="dsw" style="background:${it.color}"></span><span class="dleg-l">${esc(it.label)}</span><span class="dleg-v">${money(it.value)}</span><span class="dleg-p muted">${Math.round(it.value/tot*100)}%</span></div>`).join('')}</div></div>`;
}
function lineChart(points,h=220,color='#b8f04a'){
  const gid=uid(),W=720,H=h,pL=50,pR=12,pT=12,pB=24;
  let min=Math.min(...points.map(p=>p.value)),max=Math.max(...points.map(p=>p.value));
  if(min===max){min-=1;max+=1;}const padv=(max-min)*.14;min-=padv;max+=padv;
  const X=i=>pL+(W-pL-pR)*(points.length===1?.5:i/(points.length-1));
  const Y=v=>pT+(H-pT-pB)*(1-(v-min)/(max-min));
  const pts=points.map((p,i)=>({x:X(i),y:Y(p.value)}));
  const path=smoothPath(pts),area=path+`L${pts[pts.length-1].x.toFixed(1)},${H-pB} L${pts[0].x.toFixed(1)},${H-pB} Z`;
  let g='';for(let i=0;i<=4;i++){const y=pT+(H-pT-pB)*i/4;
    g+=`<line x1="${pL}" x2="${W-pR}" y1="${y}" y2="${y}" class="cgrid"/><text x="${pL-8}" y="${y+4}" class="cylab" text-anchor="end">${moneyShort(max-(max-min)*i/4)}</text>`;}
  const step=Math.max(1,Math.round(points.length/6));let xl='';
  points.forEach((p,i)=>{if(i%step===0||i===points.length-1)xl+=`<text x="${X(i)}" y="${H-7}" class="cxl" text-anchor="middle">${esc(p.label)}</text>`;});
  const dots=points.map((p,i)=>`<circle class="lpt" cx="${X(i).toFixed(1)}" cy="${Y(p.value).toFixed(1)}" r="3.4" fill="#0c120f" stroke="${color}" stroke-width="2" data-tip="${esc(p.label)}: ${money(p.value)}"/>`).join('');
  const last=pts[pts.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" class="chart"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".28"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
  ${g}<path d="${area}" fill="url(#${gid})"/><path d="${path}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linecap="round"/>${dots}
  <circle cx="${last.x.toFixed(1)}" cy="${last.y.toFixed(1)}" r="6" fill="${color}" opacity=".3" style="animation:pulse 2s infinite"/></svg>`;
}
function spark(vals,color='#b8f04a'){
  if(vals.length<2)vals=[...vals,...vals];
  const W=110,H=34,min=Math.min(...vals),max=Math.max(...vals),r=max-min||1;
  const pts=vals.map((v,i)=>`${(W*i/(vals.length-1)).toFixed(1)},${(H-4-(H-8)*(v-min)/r).toFixed(1)}`).join(' ');
  return `<svg class="spark" width="110" height="34" viewBox="0 0 ${W} ${H}"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/></svg>`;
}

function reportRange(){
  const d=parseD(rep.anchor);let s,e;
  if(rep.mode==='daily'){s=e=iso(d);}
  else if(rep.mode==='weekly'){const day=(d.getDay()+6)%7;s=iso(addDays(d,-day));e=iso(addDays(parseD(s),6));}
  else if(rep.mode==='monthly'){s=iso(new Date(d.getFullYear(),d.getMonth(),1));e=iso(new Date(d.getFullYear(),d.getMonth()+1,0));}
  else{s=iso(new Date(d.getFullYear(),0,1));e=iso(new Date(d.getFullYear(),11,31));}
  return{s,e};
}
function periodLabel(){const{s,e}=reportRange();return rep.mode==='daily'?fmtDateFull(s):rep.mode==='weekly'?`${fmtDate(s)} – ${fmtDate(e)}`:rep.mode==='monthly'?monthLabel(monthKey(s)):s.slice(0,4);}

function renderCalendar(){
  const{y,m}=cal,first=new Date(y,m,1),startIdx=(first.getDay()+6)%7,dim=new Date(y,m+1,0).getDate;
  const byDay={},billByDay={};
  db.transactions.forEach(t=>{(byDay[t.date]=byDay[t.date]||[]).push(t);});
  db.bills.forEach(b=>{(billByDay[b.due]=billByDay[b.due]||[]).push(b);});
  let cells='';
  for(let i=0;i<startIdx;i++){const dd=new Date(y,m,1-startIdx+i+1);cells+=`<div class="calcell dim"><span class="dn">${dd.getDate()}</span></div>`;}
  for(let d=1;d<=dim;d++){
    const ds=`${y}-${pad(m+1)}-${pad(d)}`,txs=byDay[ds]||[],bills=billByDay[ds]||[];
    const inc=txs.reduce((a,t)=>a+(t.type==='income'?t.amount:0),0),exp=txs.reduce((a,t)=>a+(t.type==='expense'?t.amount:0),0);
    cells+=`<div class="calcell ${ds===todayISO()?'today':''} ${ds===cal.sel?'sel':''}" data-act="cal-day" data-date="${ds}">

function openTxModal(pre={}){
  if(!db.wallets.length){toast('Buat dompet dulu','warn','Transaksi membutuhkan minimal satu dompet.');openWalletModal();return;}
  const t=pre.tx;let type=pre.type||t?.type||'expense';

    ${[['expense','Pengeluaran'],['income','Pemasukan'],['transfer','Transfer']].map(([k,l])=>`<button type="button" style="flex:1" class="${type===k?'on':''}" data-tt="${k}">${l}</button>`).join('')}</div>`;
  const recF=t?.recur?.freq&&t.recur.freq!=='none'?t.recur.freq:'none';
  openModal(`<div class="mhead"><h3>${t?'Edit Transaksi':'Tambah Transaksi'}</h3><button class="icon-btn tiny" data-act="modal-close">${icon('x',14)}</button></div>
  <form id="f-tx"><div class="mbody">${tabs}
    <label class="lbl">Jumlah (Rp)</label><input class="inp num" id="tx-amt" type="number" min="0" step="100" required placeholder="0" value="${t?.amount||''}" style="font-size:18px;font-family:var(--fd)">
    <div id="tx-dyn"></div>
    <div class="frow">
      <div><label class="lbl">Tanggal</label><input class="inp" type="date" id="tx-date" value="${t?.date||pre.date||todayISO()}" required></div>
      <div><label class="lbl">Metode Pembayaran</label><select class="inp" id="tx-method">${METHODS.map(m=>`<option ${t?.method===m?'selected':''}>${m}</option>`).join('')}</select></div>
    </div>
    <div class="frow">
      <div><label class="lbl">${icon('refresh',12)} Ulangi otomatis</label><select class="inp" id="tx-rec">
        <option value="none" ${recF==='none'?'selected':''}>Tidak</option>
        <option value="daily" ${recF==='daily'?'selected':''}>Harian</option>
        <option value="weekly" ${recF==='weekly'?'selected':''}>Mingguan</option>
        <option value="monthly" ${recF==='monthly'?'selected':''}>Bulanan</option></select></div>
      <div><label class="lbl">Sampai tanggal (opsional)</label><input class="inp" type="date" id="tx-until" value="${t?.recur?.until||''}"></div>
    </div>
    <label class="lbl">Catatan (opsional)</label><input class="inp" id="tx-note" value="${esc(t?.note||'')}" placeholder="mis. Makan siang dengan tim" maxlength="120">
  </div><div class="mfoot"><button type="button" class="btn ghost" data-act="modal-close">Batal</button><button type="submit" class="btn primary">${t?'Simpan Perubahan':'Simpan Transaksi'}</button></div></form>`);
  const dyn=$('#tx-dyn');
  function drawDyn(){
    const wSel=t?.walletId||db.wallets[0]?.id;
    let h=`<label class="lbl">${type==='income'?'Dompet tujuan':'Dompet sumber'}</label><select class="inp" id="tx-w1">${walletOpts(wSel)}</select>`;
    if(type==='transfer')h+=`<label class="lbl">Ke dompet</label><select class="inp" id="tx-w2">${walletOpts(t?.toWalletId||db.wallets.find(w=>w.id!==wSel)?.id)}</select>`;
    else h+=`<label class="lbl">Kategori</label><select class="inp" id="tx-cat">${catOpts(type==='transfer'?'expense':type,t?.categoryId)}</select>`;
    dyn.innerHTML=h;
  }
  drawDyn();
  $('#tx-tabs').addEventListener('click',e=>{
    const b=e.target.closest('[data-tt]');if(!b)return;
    type=b.dataset.tt;$$('#tx-tabs button').forEach(x=>x.classList.toggle('on',x===b));drawDyn();
  });
  $('#f-tx').addEventListener('submit',e=>{
    e.preventDefault();
    const amount=Math.round(+$('#tx-amt').value||0);
    if(amount<=0)return toast('Jumlah tidak valid','err');
    const w1=$('#tx-w1')?.value,w2=$('#tx-w2')?.value,cat=$('#tx-cat')?.value;
    if(type==='transfer'&&w1===w2)return toast('Dompet tujuan harus berbeda','err');
    const freq=$('#tx-rec').value,until=$('#tx-until').value||null;
    const tx={id:t?.id||uid(),type,amount,walletId:w1,toWalletId:type==='transfer'?w2:null,categoryId:type==='transfer'?null:cat,date:$('#tx-date').value||todayISO(),method:$('#tx-method').value,note:$('#tx-note').value.trim(),createdAt:t?.createdAt||Date.now()};
    if(freq!=='none')tx.recur={freq,next:advanceDate(tx.date,freq),until};
    const doSave=()=>{
      if(t){const i=db.transactions.findIndex(x=>x.id===t.id);db.transactions[i]=tx;}else db.transactions.push(tx);
      save();closeModal();refresh();toast(t?'Transaksi diperbarui':'Transaksi dicatat','ok',TX_LABEL[type]+' • '+money(amount)+(freq!=='none'?' • berulang '+REC_LABEL[freq].toLowerCase():''));
    };
    const pb=projBalance(w1,tx,t?.id);
    if(pb<0)confirmDialog({title:'Saldo menjadi negatif',msg:`Saldo "${esc(wName(w1))}" akan menjadi ${money(pb)} setelah transaksi ini. Lanjutkan?`,okText:'Lanjutkan',danger:false,onOk:doSave});
    else doSave();
  });
}
function delTx(id){

  confirmDialog({title:'Hapus transaksi?',msg:`${TX_LABEL[t.type]} ${money(t.amount)} pada ${fmtDateFull(t.date)} akan dihapus permanen.${recNote} Saldo dompet, anggaran, dan laporan akan diperbarui otomatis.`,onOk:()=>{

}

async function hashPin(p){
  try{if(crypto?.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('finora:'+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}}catch(e){}
  let h=5381;for(const c of 'finora:'+p)h=(h*33^c.charCodeAt(0))>>>0;return 'f'+h.toString(36);
}

function download(name,content,mime){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:mime}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);}

function restoreFile(file){
  const r=new FileReader();
  r.onload=()=>{try{
    const j=JSON.parse(r.result);const data=j.data||j;
    if(!Array.isArray(data.wallets)||!Array.isArray(data.transactions)||!Array.isArray(data.categories))throw 0;
    confirmDialog({title:'Restore backup?',msg:'Seluruh data saat ini akan DIGANTI dengan isi backup. Lanjutkan?',okText:'Restore',onOk:()=>{db=data;db.dismissedNotifs=db.dismissedNotifs||[];db.flags=db.flags||{welcomed:true};db.security=db.security||{pin:null};db.ui=db.ui||{privacy:false};db.emergency=db.emergency||{target:0,history:[]};applyPriv();save();closeModal();location.hash='#/dashboard';refresh();toast('Data dipulihkan','ok');}});
  }catch(e){toast('File tidak valid','err','Pastikan file berasal dari backup FINORA.');}};
  r.readAsText(file);
}
function buildCSV(list){
  const rows=[['Tanggal','Jenis','Kategori','Dompet','Dompet Tujuan','Metode','Catatan','Jumlah']];
  list.forEach(t=>{rows.push([t.date,TX_LABEL[t.type],catById(t.categoryId)?.name||'',wName(t.walletId),t.toWalletId?wName(t.toWalletId):'',t.method||'',(t.note||'').replace(/[\r\n,]+/g,' '),t.type==='income'?t.amount:t.type==='expense'?-t.amount:0]);});
  return '\uFEFF'+rows.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
}

  function doSeed(){
    const R=rng(20261030);

    const push=o=>db.transactions.push(mkT(o));

/* ---------- 13. NOTIFIKASI & PENCARIAN ---------- */
function buildAlerts(){
  const t0=todayISO(),out=[];
  db.bills.filter(b=>!b.paid).forEach(b=>{
    const d=daysBetween(t0,b.due);
    if(d<0)out.push({id:'bill-late-'+b.id,icon:'receipt',tone:'err',title:`Tagihan terlambat: ${b.name}`,desc:`Terlambat ${-d} hari • ${money(b.amount)}`,go:'bills'});
    else if(d<=7)out.push({id:'bill-due-'+b.id,icon:'receipt',tone:'warn',title:`Tagihan segera jatuh tempo: ${b.name}`,desc:d===0?'Hari ini!':`${d} hari lagi • ${money(b.amount)}`,go:'bills'});
  });
  const mk=monthKey(t0);
  db.budgets.filter(b=>b.month===mk).forEach(b=>{
    const used=catSpend(mk,b.categoryId),pct=b.limit?used/b.limit*100:0;
    if(pct>=100)out.push({id:'bud-over-'+b.id,icon:'target',tone:'err',title:`Anggaran terlampaui: ${catById(b.categoryId)?.name}`,desc:`${money(used)} dari ${money(b.limit)}`,go:'budgets'});
    else if(pct>=80)out.push({id:'bud-warn-'+b.id,icon:'target',tone:'warn',title:`Anggaran hampir habis: ${catById(b.categoryId)?.name}`,desc:`${Math.round(pct)}% terpakai • sisa ${money(b.limit-used)}`,go:'budgets'});
  });
  db.debts.forEach(d=>{
    if(debtLeft(d)<=0)return;const dd=daysBetween(t0,d.due);
    if(dd<0)out.push({id:'debt-late-'+d.id,icon:'debt',tone:'err',title:`${d.kind==='hutang'?'Utang':'Piutang'} terlambat: ${d.party}`,desc:`Sisa ${money(debtLeft(d))}`,go:'debts'});
    else if(dd<=7)out.push({id:'debt-due-'+d.id,icon:'debt',tone:'warn',title:`Tenggat ${d.kind==='hutang'?'utang':'piutang'} dekat: ${d.party}`,desc:`${dd} hari lagi • ${money(debtLeft(d))}`,go:'debts'});
  });
  return out;
}
function updateChrome(){
  $('#sb-bal').textContent=money(totalBalance());
  const nm=db.profile.name||'Pengguna';$('#sb-name').textContent=nm;$('#sb-ava').textContent=(nm[0]||'F').toUpperCase();
  $('#sb-date').textContent=fmtDate(todayISO());
  const alerts=buildAlerts().filter(a=>!db.dismissedNotifs.includes(a.id));
  const dot=$('#bell-dot');if(dot){dot.textContent=alerts.length;dot.classList.toggle('on',alerts.length>0);}
  const unpaid=db.bills.filter(b=>!b.paid&&daysBetween(todayISO(),b.due)<=7).length;
  const nb=$('#nb-bills');if(nb){nb.textContent=unpaid;nb.style.display=unpaid?'':'none';}
}
function toggleNotif(){
  const p=$('#notif-panel');
  if(p.classList.contains('on')){p.classList.remove('on');return;}
  const alerts=buildAlerts().filter(a=>!db.dismissedNotifs.includes(a.id));
  const tones={err:['var(--rose-soft)','var(--rose)'],warn:['var(--amber-soft)','var(--amber)']};
  p.innerHTML=`<div class="np-h"><b>Notifikasi</b><button class="btn ghost sm" data-act="notif-read">Tandai dibaca</button></div>
  ${alerts.length?alerts.map(a=>{const[c,tc]=tones[a.tone];return `<div class="np-i" data-act="notif-go" data-go="${a.go}"><div class="ic" style="background:${c};color:${tc}">${icon(a.icon,16)}</div><div><b>${esc(a.title)}</b><p>${esc(a.desc)}</p></div></div>`;}).join('')
  :'<div style="padding:26px;text-align:center" class="muted sm">Tidak ada notifikasi baru. ✨</div>'}`;
  p.classList.add('on');
}
function runSearch(q){
  const box=$('#gs-res');
  if(!q||q.length<2){box.classList.remove('on');return;}
  const s=q.toLowerCase(),hits=[];
  db.transactions.filter(t=>(t.note||'').toLowerCase().includes(s)||(catById(t.categoryId)?.name||'').toLowerCase().includes(s)).slice(0,5)
    .forEach(t=>hits.push({g:'Transaksi',icon:catById(t.categoryId)?.icon||'swap',t:catById(t.categoryId)?.name||TX_LABEL[t.type],s:fmtDate(t.date)+(t.note?' • '+t.note:''),v:money(t.amount),go:'transactions'}));
  db.wallets.filter(w=>w.name.toLowerCase().includes(s)).forEach(w=>hits.push({g:'Dompet',icon:WTYPES[w.type]?.i,t:w.name,s:WTYPES[w.type]?.l,v:money(walletBalance(w)),go:'wallets'}));
  db.goals.filter(g=>g.name.toLowerCase().includes(s)).forEach(g=>hits.push({g:'Tabungan',icon:'coins',t:g.name,s:Math.round(goalCurrent(g)/g.target*100)+'% tercapai',v:money(goalCurrent(g)),go:'savings'}));
  db.bills.filter(b=>b.name.toLowerCase().includes(s)).forEach(b=>hits.push({g:'Tagihan',icon:'receipt',t:b.name,s:b.paid?'Lunas':'Jatuh tempo '+fmtDate(b.due),v:money(b.amount),go:'bills'}));
  db.debts.filter(d=>d.party.toLowerCase().includes(s)).forEach(d=>hits.push({g:'Utang/Piutang',icon:'debt',t:d.party,s:d.kind==='hutang'?'Utang':'Piutang',v:money(debtLeft(d)),go:'debts'}));
  if(!hits.length){box.innerHTML='<div style="padding:16px" class="muted sm">Tidak ada hasil untuk “'+esc(q)+'”.</div>';box.classList.add('on');return;}
  let last='',html='';
  hits.forEach(h=>{if(h.g!==last){html+=`<div class="gs-g">${h.g}</div>`;last=h.g;}
    html+=`<div class="gs-i" data-act="gs-go" data-go="${h.go}">${icon(h.icon||'dots',15)}<div><b>${esc(h.t)}</b><div class="xs faint">${esc(h.s)}</div></div><span>${h.v}</span></div>`;});
  box.innerHTML=html;box.classList.add('on');
}

    'export-csv':()=>{if(!db.transactions.length)return toast('Belum ada transaksi','warn');download(`finora_semua_transaksi_${todayISO()}.csv`,buildCSV([...db.transactions].sort((a,b)=>a.date.localeCompare(b.date))),'text/csv');toast('CSV diekspor','ok');},
    'reset-all':()=>confirmDialog({title:'Hapus SEMUA data?',msg:'Seluruh data akan dihapus permanen dari perangkat ini. Tidak bisa dibatalkan.',okText:'Hapus Semua',onOk:()=>{db=defaultDB();applyPriv();save();location.hash='#/dashboard';refresh();toast('Semua data dihapus','ok');}}),
    'cat-del':()=>{const c=catById(id);
      const used=db.transactions.some(t=>t.categoryId===id)||db.budgets.some(b=>b.categoryId===id);
      if(used)return toast('Kategori dipakai','err','Hapus/ubah transaksi & anggaran yang memakainya dulu.');
      confirmDialog({title:'Hapus kategori?',msg:`Kategori "${esc(c.name)}" akan dihapus.`,onOk:()=>{db.categories=db.categories.filter(x=>x.id!==id);save();refresh();toast('Kategori dihapus','ok');}});},
    'pin-set':pinModal,
    'pin-off':()=>confirmDialog({title:'Hapus PIN?',msg:'Aplikasi tidak lagi meminta PIN saat dibuka.',okText:'Hapus PIN',onOk:()=>{db.security.pin=null;save();toast('PIN dihapus','ok');}}),
    'unlock':tryUnlock
  };
  if(A[act])A[act]();
});
document.addEventListener('submit',e=>{
  if(e.target.id==='f-profile'){e.preventDefault();db.profile.name=$('#set-name').value.trim()||'Pengguna FINORA';db.profile.currency='IDR';save();refresh();toast('Profil disimpan','ok');}
  if(e.target.id==='f-cat'){e.preventDefault();const n=$('#cat-name').value.trim();if(!n)return;
    db.categories.push({id:uid(),name:n,type:$('#cat-type').value,icon:$('#cat-icon').value,color:CAT_COLORS[Math.floor(Math.random()*CAT_COLORS.length)],custom:true});
    save();refresh();toast('Kategori ditambahkan','ok',n);}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='restore-file'&&t.files[0])restoreFile(t.files[0]);
  if(t.id==='tx-q'||t.id==='tx-type'||t.id==='tx-cat'||t.id==='tx-w'||t.id==='tx-from'||t.id==='tx-to'){
    txF={q:$('#tx-q').value,type:$('#tx-type').value,cat:$('#tx-cat').value,wallet:$('#tx-w').value,from:$('#tx-from').value,to:$('#tx-to').value};refresh();
  }
});
let sTimer;
document.addEventListener('input',e=>{
  if(e.target.id==='gsearch'){clearTimeout(sTimer);const q=e.target.value.trim();sTimer=setTimeout(()=>runSearch(q),160);}
});
const KEY_PAGES={'1':'dashboard','2':'transactions','3':'wallets','4':'budgets','5':'savings','6':'bills','7':'debts','8':'reports','9':'calendar','0':'settings'};
document.addEventListener('keydown',e=>{
  const pal=$('#palette');
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();pal.hidden?openPal():closePal();return;}
  if(!pal.hidden){
    if(e.key==='Escape')closePal();
    else if(e.key==='ArrowDown'){e.preventDefault();movePal(1);}
    else if(e.key==='ArrowUp'){e.preventDefault();movePal(-1);}
    else if(e.key==='Enter'){e.preventDefault();runPal();}
    return;
  }
  if(e.key==='Escape'){closeModal();$('#notif-panel').classList.remove('on');$('#gs-res').classList.remove('on');return;}
  if(e.key==='Enter'&&$('#lock').classList.contains('on')){tryUnlock();return;}
  if(/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))return;
  if($('#modal-root .mback'))return;
  if(e.key.toLowerCase()==='n'){e.preventDefault();openTxModal();return;}
  if(e.key==='/'){e.preventDefault();$('#gsearch').focus();return;}
  if(KEY_PAGES[e.key])location.hash='#/'+KEY_PAGES[e.key];
});
async function tryUnlock(){
  const inp=$('#pin-in');
  if(await hashPin(inp.value)===db.security.pin){$('#lock').classList.remove('on');inp.value='';toast('Selamat datang kembali','ok',db.profile.name);}
  else{inp.value='';inp.classList.remove('shake');void inp.offsetWidth;inp.classList.add('shake');toast('PIN salah','err');}
}

/* ---------- 15. ROUTER & BOOT ---------- */
const ROUTES={
  dashboard:{fn:renderDashboard,t:'Dashboard',s:'Ringkasan keuangan Anda'},
  transactions:{fn:renderTransactions,t:'Transaksi',s:'Catat & kelola semua transaksi'},
  wallets:{fn:renderWallets,t:'Dompet',s:'Semua rekening & dompet Anda'},
  budgets:{fn:renderBudgets,t:'Anggaran',s:'Batas pengeluaran per kategori'},
  savings:{fn:renderSavings,t:'Tabungan',s:'Target & dana darurat'},
  bills:{fn:renderBills,t:'Tagihan',s:'Pantau jatuh tempo'},
  debts:{fn:renderDebts,t:'Utang & Piutang',s:'Catatan pinjaman'},
  reports:{fn:renderReports,t:'Laporan',s:'Analisis keuangan'},
  calendar:{fn:renderCalendar,t:'Kalender',s:'Aktivitas per tanggal'},
  settings:{fn:renderSettings,t:'Pengaturan',s:'Profil, kategori & data'}
};
const NAV_META={dashboard:['grid','Dashboard'],transactions:['swap','Transaksi'],wallets:['wallet','Dompet'],budgets:['target','Anggaran'],savings:['coins','Tabungan'],bills:['receipt','Tagihan'],debts:['debt','Utang & Piutang'],reports:['chart','Laporan'],calendar:['calendar','Kalender'],settings:['gear','Pengaturan']};
function initNav(){
  let i=1;
  $$('#snav a').forEach(a=>{const[ic,lb]=NAV_META[a.dataset.r];
    a.innerHTML=icon(ic,17)+' '+lb+(a.dataset.r==='bills'?'<span class="nbadge" id="nb-bills"></span>':`<span class="nkbd">${i%10}</span>`);i++;});
  $('.bell').innerHTML=icon('bell',18)+'<span class="dot" id="bell-dot"></span>';
  $('#btn-addtx').innerHTML=icon('plus',16)+'<span>Transaksi</span>';
  $('.fab').innerHTML=icon('plus',22);
  $('.only-m').innerHTML=icon('menu',19);
  $('.tb-search').insertAdjacentHTML('afterbegin',icon('search',15));
  $('#priv-btn').innerHTML=icon(db.ui.privacy?'eyeOff':'eye',18);
}
function refresh(){route();}
function route(){
  const r=((location.hash||'#/dashboard').replace('#/',''))||'dashboard';
  const cfg=ROUTES[r]||ROUTES.dashboard;
  $$('#snav a').forEach(a=>a.classList.toggle('on',a.dataset.r===r));
  $('#tb-h').textContent=cfg.t;$('#tb-sub').textContent=cfg.s;
  document.title='FINORA — '+cfg.t;
  view.classList.remove('view-enter');void view.offsetWidth;
  view.innerHTML=cfg.fn();view.classList.add('view-enter');
  animateNumbers(view);updateChrome();
  $('#sidebar').classList.remove('open');$('#scrim').classList.remove('on');
}
window.addEventListener('hashchange',route);
(function boot(){
  initNav();applyPriv();
  if(runRecurring())localStorage.setItem(LS_KEY,JSON.stringify(db));
  if(!location.hash)location.hash='#/dashboard';
  route();
  if(db.security.pin)$('#lock').classList.add('on');
  if(!db.flags.welcomed){
    db.flags.welcomed=true;save();
    setTimeout(()=>openModal(`<div style="padding:30px 28px;text-align:center">
      <div class="logo-mark" style="margin:0 auto 16px;width:52px;height:52px;font-size:26px">F</div>
      <h3 style="font-size:20px">Selamat datang di FINORA 4.8 Pro Max 👋</h3>
      <p class="muted sm" style="margin:10px 0 22px">Skor kesehatan finansial, smart insights, heatmap pengeluaran, command palette, dan transaksi berulang. Semua data tersimpan privat di browser Anda.</p>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button class="btn primary" data-act="wallet-add">${icon('plus',15)} Buat Dompet Pertama</button>
        <button class="btn ghost" data-act="seed-demo">${icon('refresh',15)} Coba Data Contoh</button>
      </div></div>`),1500);
  }
  setTimeout(()=>$('#splash')?.remove(),1900);
})();
</script>
